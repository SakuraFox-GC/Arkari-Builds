name: Build native Arkari

on:
  workflow_call:
    inputs:
      arkari_ref:
        type: string
        required: true
      rpmalloc_ref:
        type: string
        default: develop
      parallel_jobs:
        type: string
        default: '0'
      parallel_link_jobs:
        type: string
        default: '0'
      build_type:
        type: string
        default: Release
      publish_bootstrap:
        type: boolean
        default: false
      reuse_native_run:
        type: string
        default: ''
    secrets:
      ARKARI_SOURCE_TOKEN:
        required: true
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      arkari_commit:
        value: ${{ jobs.build.outputs.arkari_commit }}
      rpmalloc_commit:
        value: ${{ jobs.build.outputs.rpmalloc_commit }}
      bootstrap_run_id:
        value: ${{ jobs.build.outputs.bootstrap_run_id }}

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh

env:
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_TARGET_TRIPLET: x64-windows-static
  VCPKG_HOST_TRIPLET: x64-windows-static

jobs:
  build:
    outputs:
      artifact_name: ${{ steps.reuse.outputs.artifact_name || steps.package.outputs.artifact_name }}
      arkari_commit: ${{ steps.reuse.outputs.arkari_commit || steps.compile.outputs.arkari_commit }}
      rpmalloc_commit: ${{ steps.reuse.outputs.rpmalloc_commit || steps.compile.outputs.rpmalloc_commit }}
      bootstrap_run_id: ${{ steps.reuse.outputs.bootstrap_run_id || github.run_id }}
    runs-on: ${{ vars.WINDOWS_RUNNER_IMAGE || 'windows-2025-vs2026' }}
    timeout-minutes: 360
    steps:
      - name: Check out build configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Visual Studio x64 environment
        if: inputs.reuse_native_run == ''
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64

      - name: Prepare paths and check configuration
        if: inputs.reuse_native_run == ''
        id: prepare
        env:
          ARKARI_SOURCE_TOKEN: ${{ secrets.ARKARI_SOURCE_TOKEN }}
          PARALLEL_JOBS: ${{ inputs.parallel_jobs }}
          PARALLEL_LINK_JOBS: ${{ inputs.parallel_link_jobs }}
          ARKARI_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ARKARI_SOURCE_TOKEN)) {
            throw 'Configure the ARKARI_SOURCE_TOKEN Actions secret with Contents: read access to SakuraFox-GC/Arkari.'
          }
          if ($env:ARKARI_BUILD_TYPE -notin @('Release', 'Debug')) {
            throw 'build_type must be Release or Debug.'
          }
          $jobs = 0
          if (-not [int]::TryParse($env:PARALLEL_JOBS, [ref]$jobs) -or $jobs -lt 0) {
            throw 'parallel_jobs must be a non-negative integer.'
          }
          $linkJobs = 0
          if (-not [int]::TryParse($env:PARALLEL_LINK_JOBS, [ref]$linkJobs) -or $linkJobs -lt 0 -or $linkJobs -gt 1024) {
            throw 'parallel_link_jobs must be between 0 and 1024 (0 = no additional limit).'
          }
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or -not (Test-Path "$vcpkgRoot/vcpkg.exe")) {
            throw 'The runner must provide vcpkg through VCPKG_INSTALLATION_ROOT.'
          }
          $vcpkgRef = & git -C $vcpkgRoot rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the preinstalled vcpkg revision.' }
          "vcpkg_ref=$vcpkgRef" >> $env:GITHUB_OUTPUT
          "msvc_version=$env:VCToolsVersion" >> $env:GITHUB_OUTPUT
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $binaryCache | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" >> $env:GITHUB_ENV
          "ARKARI_VCPKG_INSTALLED=$env:RUNNER_TEMP/arkari-vcpkg-installed" >> $env:GITHUB_ENV
          "ARKARI_BUILD_ROOT=$env:RUNNER_TEMP/arkari-build" >> $env:GITHUB_ENV
          "ARKARI_BOOTSTRAP_ROOT=$env:RUNNER_TEMP/arkari-native" >> $env:GITHUB_ENV
          "ARKARI_PACKAGE_ROOT=$env:RUNNER_TEMP/arkari-build/install" >> $env:GITHUB_ENV
          # Only remove unused Android tooling on this disposable hosted runner.
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted' -and (Test-Path 'C:/Android')) {
            Remove-Item 'C:/Android' -Recurse -Force
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enable Git long paths.' }

      - name: Restore vcpkg binary cache
        if: inputs.reuse_native_run == ''
        id: vcpkg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.msvc_version }}-${{ steps.prepare.outputs.vcpkg_ref }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.msvc_version }}-

      - name: Install static dependencies
        if: inputs.reuse_native_run == ''
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_ROOT/vcpkg.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'The preinstalled vcpkg could not start.' }
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --triplet=x64-windows-static `
            --host-triplet=x64-windows-static `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$env:ARKARI_VCPKG_INSTALLED" `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed.' }

      - name: Save vcpkg binary cache
        if: inputs.reuse_native_run == '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Find saved native artifact
        if: inputs.reuse_native_run != ''
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.reuse_native_run }}
          ARKARI_BUILD_TYPE: ${{ inputs.build_type }}
          PUBLISH_BOOTSTRAP: ${{ inputs.publish_bootstrap }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NATIVE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'native_run_id must be a workflow run ID.' }
          if ($env:PUBLISH_BOOTSTRAP -ne 'true') { throw 'native_run_id requires build_lto=true.' }
          $response = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:NATIVE_RUN_ID/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read saved native artifacts.' }
          $artifacts = @(($response | ConvertFrom-Json).artifacts | Where-Object {
            -not $_.expired -and $_.name -cmatch "^Arkari-Windows-x64-$env:ARKARI_BUILD_TYPE-[0-9a-f]{12}-[0-9]+-[0-9]+$"
          })
          if ($artifacts.Count -ne 1) { throw 'Expected one unexpired matching native toolchain artifact.' }
          "artifact_id=$($artifacts[0].id)" >> $env:GITHUB_OUTPUT
          "artifact_name=$($artifacts[0].name)" >> $env:GITHUB_OUTPUT

      - name: Download saved native artifact
        if: inputs.reuse_native_run != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.lookup.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.reuse_native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/arkari-native-artifact

      - name: Verify saved native artifact
        if: inputs.reuse_native_run != ''
        id: reuse
        env:
          NATIVE_RUN_ID: ${{ inputs.reuse_native_run }}
          NATIVE_ARTIFACT: ${{ steps.lookup.outputs.artifact_name }}
          ARKARI_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          ./scripts/Reuse-Native.ps1 -ArtifactDir "$env:RUNNER_TEMP/arkari-native-artifact" -ArtifactName $env:NATIVE_ARTIFACT -RunId $env:NATIVE_RUN_ID -BuildType $env:ARKARI_BUILD_TYPE

      - name: Check out Arkari sources
        if: inputs.reuse_native_run == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SakuraFox-GC/Arkari
          ref: ${{ inputs.arkari_ref }}
          token: ${{ secrets.ARKARI_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: sources/arkari

      - name: Check out latest upstream rpmalloc
        if: inputs.reuse_native_run == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mjansson/rpmalloc
          ref: ${{ inputs.rpmalloc_ref }}
          persist-credentials: false
          fetch-depth: 1
          path: sources/rpmalloc

      - name: Configure, build and install distribution
        if: inputs.reuse_native_run == ''
        id: compile
        env:
          ARKARI_REQUESTED_REF: ${{ inputs.arkari_ref }}
          ARKARI_PARALLEL_JOBS: ${{ inputs.parallel_jobs }}
          ARKARI_PARALLEL_LINK_JOBS: ${{ inputs.parallel_link_jobs }}
          ARKARI_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          ./scripts/Build.ps1 -ParallelJobs ([int]$env:ARKARI_PARALLEL_JOBS) -ParallelLinkJobs ([int]$env:ARKARI_PARALLEL_LINK_JOBS) -BuildType $env:ARKARI_BUILD_TYPE

      - name: Smoke test installed toolchain
        if: inputs.reuse_native_run == ''
        env:
          ARKARI_BUILD_TYPE: ${{ inputs.build_type }}
        run: ./scripts/Test-Toolchain.ps1 -InstallDir $env:ARKARI_PACKAGE_ROOT -BuildType $env:ARKARI_BUILD_TYPE

      - name: Upload native protection reports and diagnostics
        if: always() && inputs.reuse_native_run == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arkari-smoke-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arkari-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Package toolchain
        if: inputs.reuse_native_run == ''
        id: package
        env:
          ARKARI_PUBLISH_BOOTSTRAP: ${{ inputs.publish_bootstrap }}
        run: |
          ./scripts/Package.ps1 -IncludeBootstrap:($env:ARKARI_PUBLISH_BOOTSTRAP -eq 'true')

      - name: Upload toolchain and checksums
        if: inputs.reuse_native_run == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Collect configure diagnostics on failure
        if: failure() && inputs.reuse_native_run == ''
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'arkari-diagnostics'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          foreach ($relativePath in @('CMakeCache.txt', 'CMakeFiles/CMakeConfigureLog.yaml')) {
            $source = Join-Path "$env:ARKARI_BUILD_ROOT/build" $relativePath
            if (Test-Path $source) {
              Copy-Item $source (Join-Path $diagnostics (Split-Path $source -Leaf))
            }
          }
          $buildtrees = Join-Path $env:VCPKG_ROOT 'buildtrees'
          if (Test-Path $buildtrees) {
            Get-ChildItem $buildtrees -Recurse -Filter '*.log' -File | ForEach-Object {
              $relativePath = [IO.Path]::GetRelativePath($buildtrees, $_.FullName)
              $destination = Join-Path "$diagnostics/vcpkg" $relativePath
              New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
              Copy-Item $_.FullName $destination
            }
          }

      - name: Upload configure diagnostics on failure
        if: failure() && inputs.reuse_native_run == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arkari-configure-diagnostics-native-${{ github.run_id }}
          path: ${{ runner.temp }}/arkari-diagnostics
          if-no-files-found: ignore
          retention-days: 7
