name: Build Arkari for Windows

run-name: ${{ inputs.build_lto && 'Windows x64 ThinLTO' || 'Windows x64' }} · ${{ inputs.arkari_ref }}

on:
  workflow_dispatch:
    inputs:
      arkari_ref:
        description: Arkari branch, tag, or commit
        required: true
        default: llvm-23.x
        type: string
      parallel_jobs:
        description: Compile jobs (0 = runner CPU count)
        required: true
        default: '0'
        type: string
      build_lto:
        description: Also build ThinLTO binaries with native libraries (two jobs)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arkari-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native toolchain
    uses: ./.github/workflows/build-stage.yml
    with:
      arkari_ref: ${{ inputs.arkari_ref }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      publish_bootstrap: ${{ inputs.build_lto }}
    secrets:
      ARKARI_SOURCE_TOKEN: ${{ secrets.ARKARI_SOURCE_TOKEN }}

  lto:
    name: ThinLTO binaries with native libraries
    needs: native
    if: inputs.build_lto
    uses: ./.github/workflows/build-stage.yml
    with:
      arkari_ref: ${{ needs.native.outputs.arkari_commit }}
      rpmalloc_ref: ${{ needs.native.outputs.rpmalloc_commit }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      thin_lto: true
      bootstrap_artifact: ${{ needs.native.outputs.artifact_name }}
    secrets:
      ARKARI_SOURCE_TOKEN: ${{ secrets.ARKARI_SOURCE_TOKEN }}
