name: Build Arkari for Windows

run-name: ${{ inputs.build_lto && 'Windows x64 ThinLTO' || 'Windows x64' }} · ${{ inputs.build_type }} · ${{ inputs.arkari_ref }}

on:
  workflow_dispatch:
    inputs:
      arkari_ref:
        description: Arkari branch, tag, or commit
        required: true
        default: llvm-23.x
        type: string
      parallel_jobs:
        description: Compile jobs (0 = runner CPU count)
        required: true
        default: '0'
        type: string
      parallel_link_jobs:
        description: Max simultaneous links (0 = no additional link limit)
        required: true
        default: '0'
        type: string
      build_type:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      build_lto:
        description: Also build ThinLTO (separate compile, link and package jobs)
        required: true
        default: false
        type: boolean
      native_run_id:
        description: Reuse native artifact from this run ID (blank = build native)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: arkari-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native toolchain
    uses: ./.github/workflows/build-stage.yml
    with:
      arkari_ref: ${{ inputs.arkari_ref }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      parallel_link_jobs: ${{ inputs.parallel_link_jobs }}
      build_type: ${{ inputs.build_type }}
      publish_bootstrap: ${{ inputs.build_lto }}
      reuse_native_run: ${{ inputs.native_run_id }}
    secrets:
      ARKARI_SOURCE_TOKEN: ${{ secrets.ARKARI_SOURCE_TOKEN }}

  lto_compile:
    name: Compile ThinLTO objects
    needs: native
    if: inputs.build_lto
    uses: ./.github/workflows/build-lto-stage.yml
    with:
      arkari_ref: ${{ needs.native.outputs.arkari_commit }}
      rpmalloc_ref: ${{ needs.native.outputs.rpmalloc_commit }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      parallel_link_jobs: ${{ inputs.parallel_link_jobs }}
      build_type: ${{ inputs.build_type }}
      phase: Compile
      bootstrap_artifact: ${{ needs.native.outputs.artifact_name }}
      bootstrap_run_id: ${{ needs.native.outputs.bootstrap_run_id }}
    secrets:
      ARKARI_SOURCE_TOKEN: ${{ secrets.ARKARI_SOURCE_TOKEN }}

  lto_link:
    name: Link and install ThinLTO
    needs: [native, lto_compile]
    if: inputs.build_lto
    uses: ./.github/workflows/build-lto-stage.yml
    with:
      arkari_ref: ${{ needs.native.outputs.arkari_commit }}
      rpmalloc_ref: ${{ needs.native.outputs.rpmalloc_commit }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      parallel_link_jobs: ${{ inputs.parallel_link_jobs }}
      build_type: ${{ inputs.build_type }}
      phase: Link
      bootstrap_artifact: ${{ needs.native.outputs.artifact_name }}
      bootstrap_run_id: ${{ needs.native.outputs.bootstrap_run_id }}
      checkpoint_artifact: ${{ needs.lto_compile.outputs.artifact_name }}
    secrets:
      ARKARI_SOURCE_TOKEN: ${{ secrets.ARKARI_SOURCE_TOKEN }}

  lto_package:
    name: Merge, verify and package ThinLTO
    needs: [native, lto_link]
    if: inputs.build_lto
    uses: ./.github/workflows/package-lto.yml
    with:
      arkari_ref: ${{ needs.native.outputs.arkari_commit }}
      build_type: ${{ inputs.build_type }}
      bootstrap_artifact: ${{ needs.native.outputs.artifact_name }}
      bootstrap_run_id: ${{ needs.native.outputs.bootstrap_run_id }}
      binaries_artifact: ${{ needs.lto_link.outputs.artifact_name }}
    secrets:
      ARKARI_SOURCE_TOKEN: ${{ secrets.ARKARI_SOURCE_TOKEN }}
